name: Refresh Profile Snapshot

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-snapshot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build profile snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from html import escape
          from pathlib import Path
          from urllib.request import Request, urlopen
          import json
          import os

          login = os.environ["PROFILE_LOGIN"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "CS-LX-profile-snapshot",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path):
              request = Request(f"https://api.github.com{path}", headers=headers)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          user = api(f"/users/{login}")
          repos = api(f"/users/{login}/repos?per_page=100&type=owner&sort=updated")
          owned_repos = [repo for repo in repos if not repo.get("fork")]
          stars = sum(repo.get("stargazers_count", 0) for repo in owned_repos)
          profile_repository = os.environ.get("GITHUB_REPOSITORY", "").rsplit("/", 1)[-1].lower()
          latest_candidates = [repo for repo in owned_repos if repo.get("name", "").lower() != profile_repository]
          latest = latest_candidates[0] if latest_candidates else (owned_repos[0] if owned_repos else {"name": "—"})
          latest_name = escape(latest["name"][:16])
          refreshed = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          def text(value):
              return escape(str(value))

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="960" height="218" viewBox="0 0 960 218" role="img" aria-labelledby="title desc">
          <title id="title">CS-LX live GitHub profile snapshot</title>
          <desc id="desc">Automatically generated GitHub profile metrics.</desc>
          <rect width="960" height="218" fill="#0d1117"/>
          <rect x="1" y="1" width="958" height="216" rx="10" fill="none" stroke="#30363d" stroke-width="2"/>
          <path d="M32 59H928" stroke="#30363d"/>
          <circle cx="40" cy="32" r="6" fill="#58a6ff"/>
          <text x="58" y="37" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">PROFILE SIGNAL / LIVE SNAPSHOT</text>
          <text x="928" y="37" fill="#8b949e" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">REFRESHED {text(refreshed)}</text>
          <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
            <text x="40" y="101" fill="#f0f6fc" font-size="38" font-weight="700">{text(user.get("public_repos", 0))}</text>
            <text x="40" y="127" fill="#8b949e" font-size="12" letter-spacing="1">PUBLIC REPOS</text>
            <text x="280" y="101" fill="#58a6ff" font-size="38" font-weight="700">{text(user.get("followers", 0))}</text>
            <text x="280" y="127" fill="#8b949e" font-size="12" letter-spacing="1">FOLLOWERS</text>
            <text x="520" y="101" fill="#c9d1d9" font-size="38" font-weight="700">{text(stars)}</text>
            <text x="520" y="127" fill="#8b949e" font-size="12" letter-spacing="1">TOTAL STARS</text>
            <text x="760" y="101" fill="#c9d1d9" font-size="18" font-weight="700">{latest_name}</text>
            <text x="760" y="127" fill="#8b949e" font-size="12" letter-spacing="1">LATEST UPDATED REPO</text>
          </g>
          <path d="M32 158H928" stroke="#30363d"/>
          <text x="40" y="190" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">SOURCE: GitHub REST API · GENERATED IN-REPOSITORY · NEXT SYNC IN 6 HOURS</text>
          </svg>'''

          Path("profile/metrics.svg").write_text(svg + "\n", encoding="utf-8")
          PY

      - name: Commit profile snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics.svg
          if git diff --staged --quiet; then
            echo "No profile snapshot changes"
          else
            git commit -m "chore: refresh profile snapshot"
            git push
          fi
